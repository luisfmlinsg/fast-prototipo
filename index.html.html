<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast · protótipo conceitual da nova retirada digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#01602A;--pd:#004521;--lime:#78DE1F;--soft:#E3F3E6;--am:#C9800A;--amt:#7A4D00;--amb:#FBEFD9;--g:#F2F2F2;--t:#383838;--mut:#6B6B6B;--ln:#E2E2E2;
--dg:#0B5A33;--lg:#E8EFE4;--gr:#6B7A72;--tx:#15201A;--bg:#F7F7F2;--pl:#DCE3DD}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.top{background:var(--dg);color:#fff;font-size:13px;padding:8px 16px;text-align:center}
.wrap{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:28px 20px 40px;flex-wrap:wrap}
/* painel (identidade do deck) */
.panel{width:380px;max-width:100%}
.panel h1{font-family:"Space Grotesk","DM Sans",sans-serif;font-size:24px;line-height:1.15;color:var(--dg);margin-bottom:6px}
.panel .sub{color:var(--gr);font-size:14px;margin-bottom:18px;line-height:1.45}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dg);font-weight:700;margin:18px 0 8px}
.sc{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--pl);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;font:inherit;font-size:14px;color:var(--tx)}
.sc b{font-family:"Space Grotesk","DM Sans",sans-serif;color:var(--dg);margin-right:6px}
.sc.on{background:var(--dg);color:#fff;border-color:var(--dg)}.sc.on b{color:#9BE36A}
.note{background:#fff;border:1px solid var(--pl);border-radius:12px;padding:14px 16px}
.note h2{font-family:"Space Grotesk","DM Sans",sans-serif;font-size:17px;margin:6px 0}
.note p{font-size:14px;line-height:1.5;color:#2b3a31}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.t-nova{background:var(--dg);color:#fff}.t-alt{background:var(--amb);color:var(--amt)}.t-atual{background:var(--lg);color:var(--gr)}
.ctrl{display:flex;gap:8px;margin-top:12px}
.ctrl button{flex:1;font:inherit;font-size:14px;padding:10px;border-radius:8px;border:1px solid var(--pl);background:#fff;cursor:pointer}
.prog{font-size:12px;color:var(--gr);margin-top:8px}
/* celular (visual próximo ao app) */
.phone{width:375px;height:790px;border-radius:44px;background:#111;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.18);flex-shrink:0}
.scr{width:100%;height:100%;background:#fff;border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;font-family:"Barlow",system-ui,sans-serif;color:var(--t)}
.sb{height:38px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:14px;font-weight:600;flex-shrink:0}
.nav{display:flex;align-items:center;justify-content:center;position:relative;height:34px;font-size:12px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;font-weight:600;flex-shrink:0}
.nav .bk{position:absolute;left:10px;width:44px;height:34px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--t);cursor:pointer}
.nav .sk{position:absolute;right:16px;font-size:12px;color:var(--p);cursor:pointer;font-weight:700}
.steps{display:flex;gap:4px;padding:2px 20px 0;flex-shrink:0}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--ln)}.steps i.on{background:var(--lime)}
.stl{font-size:12px;color:var(--mut);padding:4px 20px 0;flex-shrink:0}
.ct{flex:1;overflow-y:auto;padding:10px 20px 12px}
.ft{padding:10px 20px 20px;flex-shrink:0}
.btn{display:block;width:100%;min-height:48px;background:var(--p);color:#fff;border:0;border-radius:26px;padding:14px;font:inherit;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;margin-top:8px}
.btn.sec{background:#fff;color:var(--p);border:2px solid var(--p)}
.lnk{display:flex;align-items:center;justify-content:center;min-height:44px;color:var(--p);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline}
.ttl{font-weight:700;font-size:24px;color:var(--pd);line-height:1.15;margin:8px 0}
.txt{font-size:15px;line-height:1.4}
.sm{font-size:13px;color:var(--mut);line-height:1.35}
.card{border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-top:12px;background:#fff}
.soft{background:var(--soft);border:0}.warn{background:var(--amb);border:0}.grey{background:var(--g);border:0}
.row{display:flex;gap:12px;margin-top:10px}.row>div{flex:1}
.kv small{display:block;font-size:12px;color:var(--mut)}.kv b{font-size:15px;font-weight:600}
.big b{font-size:30px;font-weight:700;color:var(--pd)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.2);vertical-align:-1px;margin-right:5px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;border-radius:6px;padding:4px 9px}
.st.ok{background:var(--soft);color:var(--p)}.st.pp{background:var(--amb);color:var(--amt)}
.ph{width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff;border-radius:12px;display:block}
.phw{position:relative}.phw .st{position:absolute;left:8px;top:8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.mini{display:flex;gap:12px;align-items:center}.mini img{width:116px;aspect-ratio:16/9;object-fit:contain;background:#fff;border-radius:8px}
.mini .m{font-weight:700;font-size:16px}
/* carrossel */
.car{border:1.5px solid var(--ln);border-radius:16px;padding:10px;margin-top:10px}
.car.sel{border-color:var(--p);box-shadow:0 0 0 1.5px var(--p) inset}
.car .m{font-weight:700;font-size:18px;color:var(--pd);margin:10px 2px 2px}
.cn{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px}
.cn span{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--p);cursor:pointer}
.cn i{width:8px;height:8px;border-radius:4px;background:var(--ln)}.cn i.on{width:24px;background:var(--lime)}
.new{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--am);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:4px;z-index:3}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin:9px 0}
.chk span{width:24px;height:24px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--p);font-weight:700;font-size:13px;flex-shrink:0}
.qr{background:#1b211d;border-radius:18px;height:230px;display:flex;align-items:center;justify-content:center;margin-top:12px;cursor:pointer}
.qr .f{width:150px;height:150px;border:3px solid var(--lime);border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;text-align:center;padding:10px}
.push{background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:12px 14px;margin:6px 0 14px;font-size:14px;line-height:1.4}
.push .pl{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:2px}
.opts{display:flex;gap:10px;margin-top:12px}
.opt{flex:1;border:1.5px solid var(--ln);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.opt:hover{border-color:var(--p)}
.opt .h{font-weight:700;font-size:16px;color:var(--pd)}.opt .tm{font-size:22px;font-weight:700;color:var(--p)}.opt .s{font-size:13px;color:var(--mut);line-height:1.3}
.optl{border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px;margin-top:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px}
.optl:hover{border-color:var(--p)}.optl .h{font-weight:700;font-size:15px}.optl .s{font-size:13px;color:var(--mut)}.optl .tm{font-weight:700;color:var(--p);font-size:14px;white-space:nowrap}
.spin{width:44px;height:44px;border:4px solid var(--soft);border-top-color:var(--p);border-radius:50%;animation:r 1s linear infinite;margin:26px auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
.ob{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:10px}
.ob .ic{width:150px;height:150px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;margin:10px 0 18px}
.obd{display:flex;gap:6px;justify-content:center;margin-top:14px}.obd i{width:8px;height:8px;border-radius:4px;background:var(--ln)}.obd i.on{width:24px;background:var(--lime)}
@media(max-width:820px){.panel{order:2}}
</style>
</head>
<body>
<div class="top">Protótipo conceitual · não é o app oficial · dados e imagens ilustrativos</div>
<div class="wrap">
  <div class="phone"><div class="scr" id="scr"></div></div>
  <div class="panel">
    <h1>Nova retirada digital Fast</h1>
    <p class="sub">O app só promete o carro que estará pronto, e sempre oferece uma alternativa. Escolha um cenário e navegue pelo celular.</p>
    <div class="lbl">Cenários</div>
    <div id="scs"></div>
    <div class="lbl">Esta tela</div>
    <div class="note" id="note"></div>
    <div class="ctrl"><button id="back">← Voltar</button><button id="reset">Reiniciar cenário</button></div>
    <div class="prog" id="prog"></div>
  </div>
</div>

 <button class="btn ${S.car==k?"":"sec"}" data-pick="${k}" style="margin-top:12px">${S.car==k?"Selecionado":"Selecionar"}</button></div>
 <div class="cn"><span data-car="-1">‹</span>${LIST.map((x,i)=>`<i class="${i==S.view?"on":""}"></i>`).join("")}<span data-car="1">›</span></div>`},
 f:()=>`<button class="btn" ${go("reservado")}>Continuar</button>`},
reservado:{tag:"nova",t:"Carro reservado",n:"O carro escolhido sai da lista dos outros clientes e não pode ser entregue no balcão. A reserva é provisória até o pagamento e depois vale até 2 horas após o horário reservado. Ainda sem placa e vaga.",
 b:()=>`<div class="ttl">Este carro está reservado para você</div>${mini(S.car,`<div style="margin-top:10px">${stTag(CARS[S.car])}</div>`)}
 <div class="card grey"><div class="chk"><span>1</span><div><b>Agora:</b> reservado por 15 min, para você concluir o pagamento</div></div><div class="chk"><span>2</span><div><b>Depois do pagamento:</b> reservado até as 16h00</div></div></div>`,
 f:()=>`<button class="btn" ${go("pagamento")}>Continuar</button>`},
pagamento:{tag:"atual",t:"Proteções, termos e pagamento",n:"Etapas que não mudam: proteções e adicionais, termos, tag de pedágio, pré-autorização e pagamento antecipado (Pix ou cartão). Aqui aparecem resumidas.",
 b:()=>`<div class="ttl">Proteções, termos e pagamento</div><p class="sm">Etapas iguais às do app atual, resumidas neste protótipo.</p>
 <div class="card">${["Proteções e adicionais","Termos e condições","Tag de pagamento de pedágio","Pré-autorização no cartão","Pagamento antecipado (Pix)"].map(t=>`<div class="chk"><span>✓</span>${t}</div>`).join("")}</div>`,
 f:()=>`<button class="btn" ${go(SC[S.sc].change?"mudou":"caminho")}>Pagar e confirmar</button>`},
mudou:{tag:"nova",t:"Aviso no trajeto: o carro mudou",n:"O pátio viu que o carro escolhido não seria entregue (por exemplo, foi para manutenção). O app avisa antes da chegada e troca por outro do mesmo grupo, pronto e livre. Esta é a troca automática do cliente. Placa e vaga continuam só para a chegada.",
 b:()=>`<div class="push"><span class="pl">FAST · agora</span>Seu carro mudou: ${CARS.onix.m} ${CARS.onix.cor.toLowerCase()}, já pronto para você.</div>
 <div class="ttl">Trocamos seu carro antes de você chegar</div><p class="txt">O ${CARS.hb.m} precisou sair de operação para manutenção. Separamos outro do mesmo grupo, já pronto.</p>${mini("onix",`<div style="margin-top:10px">${stTag(CARS.onix)}</div>`)}
 <span class="lnk">Não concordo com a troca: falar com a central</span>`,
 f:()=>`<button class="btn" data-act="takeOnix" ${go("caminho")}>Ok, entendi</button>`},
caminho:{tag:"nova",t:"A caminho",n:"Depois do pagamento, o cliente vê o carro reservado e um único botão: “Cheguei”. A vaga e a placa só aparecem depois do check-in, quando o carro está disponível.",
 b:()=>`<div class="ttl">Tudo certo. Boa viagem até a agência!</div>${mini(S.car,`<div style="margin-top:10px">${stTag(CARS[S.car])}</div>`)}
 <div class="card grey"><div class="txt">Ao chegar, toque em <b>Cheguei</b> e leia o QR code na entrada. Aí mostramos a vaga e a placa do seu carro.</div></div>
 <div class="card"><div class="sm">Agência Aeroporto · retirada às <b>14h00</b></div></div>`,
 f:()=>`<button class="btn" ${go("cheguei")}>Cheguei</button>`},
cheguei:{tag:"nova",t:"Check-in “Cheguei”",n:"O QR code prova que o cliente está na agência. O app explica onde está a placa e pede a câmera antes de abrir o leitor. Se não der para ler, há a alternativa da localização, com raio pequeno em volta da agência.",
 b:()=>`<div class="ttl">Leia o QR code da agência</div><div class="card soft" style="margin-top:6px"><div class="txt" style="font-size:14px">📍 A placa com o QR code fica <b>na entrada da agência</b> e <b>no pátio do Fast</b>. Vamos usar a câmera só para ler o código.</div></div>
 <div class="qr" ${go("verificando")}><div class="f">Toque aqui para simular a leitura</div></div>`,
 f:()=>`<span class="lnk" ${go("verificando")}>Não consegue ler? Usar minha localização</span>`},
verificando:{tag:"nova",t:"Conferência na hora",n:"Avança sozinha em poucos segundos. O app confere as mesmas condições que a abertura já exige hoje, mas antes de o cliente ir até a vaga: trancado e registrado na vaga, conferência com fotos no Pátio 360 e carro livre. A telemetria só gera alerta.",auto:"res",
 b:()=>`<div class="spin"></div><div class="ttl" style="text-align:center">Conferindo seu carro agora…</div><div class="card">${["Trancado e registrado na vaga","Conferência com fotos concluída","Carro livre para você"].map(t=>`<div class="chk"><span>✓</span>${t}</div>`).join("")}</div>`,
 f:()=>`<span class="lnk" ${go("res_"+SC[S.sc].res)}>Pular (demonstração)</span>`},
res_pronto:{tag:"nova",t:"Resultado: carro pronto",n:"O carro passou na conferência. Só agora aparecem a vaga e a placa: são as informações para o cliente ir até a vaga e encontrar o carro, com a certeza de que ele está lá.",
 b:()=>`<div class="ttl">Seu carro está pronto</div>${mini(S.car,vagaPlaca(S.car))}<p class="txt" style="margin-top:12px">Siga até a vaga e abra o carro pelo celular.</p>${S.comp=="espera"?compCard():""}`,
 f:()=>`<button class="btn" ${go("abrir")}>Ir para a vaga</button>`},
res_preparo:{tag:"nova",t:"Resultado: carro ainda em preparo",n:"O cliente chegou antes do horário reservado. As duas opções têm o mesmo peso e mostram o tempo lado a lado. Chegar cedo é uma flexibilidade: se ele esperar até o horário previsto, não há compensação.",
 b:()=>`<div class="ttl">Você chegou antes do horário da sua reserva (14h)</div><p class="txt">Seu carro deve ficar pronto às <b>13h20</b>. Se preferir, há outro carro do mesmo grupo disponível agora.</p>
 <div class="opts"><div class="opt" data-act="takeArgo" ${go("espera")}><div class="h">Esperar</div><div class="tm">~20 min</div><div class="s">${CARS.argo.m}<br>${CARS.argo.cor.toLowerCase()} · pronto às 13h20</div></div>
 <div class="opt" data-act="takeOnix" ${go("res_pronto")}><div class="h">Trocar</div><div class="tm">Agora</div><div class="s">${CARS.onix.m}<br>${CARS.onix.cor.toLowerCase()} · mesmo grupo</div></div></div>
 <p class="sm" style="margin-top:12px">Se esperar, avisamos assim que o carro estiver pronto.</p>`,f:()=>``},
espera:{tag:"nova",t:"Espera informada",n:"O cliente acompanha o preparo e recebe um aviso quando o carro fica pronto. Se a espera passar do horário reservado, ela conta para a compensação automática.",
 b:()=>`<div class="ttl">Seu carro está sendo preparado</div>${mini("argo",`<div style="margin-top:10px"><span class="st pp">◐ Pronto às ${S.sc=="C"?"14h40":"13h20"}</span></div>`)}
 <div class="card">${["Abastecido","Higienizado","Conferência com fotos","Trancado na vaga"].map((t,i)=>`<div class="chk"><span>${i<2?"✓":"·"}</span>${t}</div>`).join("")}</div><p class="sm" style="margin-top:10px">Avisaremos por notificação. Você pode aguardar na sala do Fast.</p>`,
 f:()=>`<button class="btn" data-act="${S.sc=="C"?"waitComp":"argoReady"}" ${go("res_pronto")}>Simular: carro ficou pronto</button>`},
res_upgrade:{tag:"nova",t:"Resultado: upgrade",n:"Não há carro do grupo pronto. Pela regra das trocas, o app oferece um carro de grupo superior, pronto e livre, sem custo, e explica o que muda. O cliente pode recusar e esperar o próprio carro. Um carro reservado para outro cliente nunca é usado.",
 b:()=>`<div class="ttl">Não temos um carro do seu grupo pronto agora</div><p class="txt">Liberamos um carro de grupo superior, <b>sem custo adicional</b>:</p>${mini("up")}
 <div class="card grey"><div class="sm"><b>O que muda:</b> SUV, com mais espaço interno e porta-malas maior. O consumo é um pouco maior que o de um hatch.</div></div>`,
 f:()=>`<button class="btn" data-act="takeUp" ${go("res_pronto")}>Aceitar upgrade</button><span class="lnk" data-act="takeArgo" ${go("espera")}>Prefiro esperar meu carro (pronto às 14h40)</span>`},
res_balcao:{tag:"nova",t:"Resultado: balcão prioritário",n:"Último recurso, quando não há nenhum carro disponível. O app diz onde fica o balcão e quanto tempo deve levar, e o balcão já recebe o nome e o motivo.",
 b:()=>`<div class="ttl">Vamos te atender com prioridade no balcão</div><p class="txt">Não há carro disponível agora. O balcão já sabe quem você é e o motivo.</p>
 <div class="card soft" style="text-align:center"><div class="sm">SUA SENHA PRIORITÁRIA</div><div style="font-size:42px;font-weight:700;color:var(--pd)">P-012</div><div class="txt">1 cliente na sua frente · cerca de <b>5 min</b></div></div>
 <div class="card"><div class="txt" style="font-size:14px">📍 <b>Balcão prioritário:</b> térreo, à direita da entrada principal.</div></div>
 <div class="card warn"><div class="txt" style="color:var(--amt);font-size:14px"><b>Pedimos desculpas.</b> A compensação será aplicada automaticamente, conforme a regra.</div></div>`,
 f:()=>`<button class="btn" data-act="compBalcao" ${go("fim")}>Simular: atendimento concluído</button>`},
abrir:{tag:"atual",t:"Hora de abrir as portas",n:"Tela do app atual. A diferença é que agora ela só aparece depois da conferência do “Cheguei”, então a vaga mostrada tem o carro certo.",
 b:()=>`<div class="ttl">Hora de abrir as portas pelo app</div><p class="sm">Confira as informações e, ao lado do carro, continue para a abertura.</p>${mini(S.car,vagaPlaca(S.car))}`,
 f:()=>`<button class="btn" ${go("bluetooth")}>Abrir meu carro</button>`},
bluetooth:{tag:"atual",t:"Abertura por Bluetooth",n:"Igual ao app atual: o celular se conecta ao carro por Bluetooth para destravar as portas.",
 b:()=>`<div style="display:flex;justify-content:center;margin:14px 0"><svg width="80" height="130" viewBox="0 0 90 150"><rect x="5" y="5" width="80" height="140" rx="14" fill="none" stroke="#383838" stroke-width="4"/><path d="M33 55l24 22-12 11V52l12 11-24 22" stroke="#01602A" stroke-width="4" fill="none"/></svg></div><div class="ttl">Conectando ao carro…</div>
 <div class="card">${["Fique ao lado do carro","Bluetooth ligado","Celular fora do modo de economia de bateria"].map(t=>`<div class="chk"><span>·</span>${t}</div>`).join("")}</div>`,
 f:()=>`<button class="btn" ${go(SC[S.sc].fail&&!S.failed?"falha":"aberto")}>Continuar</button>`},
falha:{tag:"nova",t:"Falha na abertura",n:"Hoje, se a abertura falha, o cliente vai ao balcão. Agora a jornada continua, com as saídas em ordem de rapidez: outro carro pronto, upgrade ou um operador, que abre pelo Pátio 360 em até 15 minutos. O contato com a central fica sempre visível.",
 b:()=>`<div class="ttl">Não conseguimos abrir o carro</div><p class="sm">O carro não respondeu ao comando de abertura. Você não precisa ir ao balcão:</p>
 <div class="optl" data-act="takeOnixF" ${go("res_pronto")}><div><div class="h">Outro carro pronto</div><div class="s">${CARS.onix.m} · ${CARS.onix.cor.toLowerCase()} · mesmo grupo</div></div><div class="tm">Agora</div></div>
 <div class="optl" data-act="takeUpF" ${go("res_pronto")}><div><div class="h">Upgrade sem custo</div><div class="s">${CARS.up.m} · SUV</div></div><div class="tm">Agora</div></div>
 <div class="optl" ${go("operador")}><div><div class="h">Chamar um operador</div><div class="s">Ele vem até você e abre este carro</div></div><div class="tm">até 15 min</div></div>`,
 f:()=>`<span class="lnk">Falar com a central</span>`},
operador:{tag:"nova",t:"Operador a caminho",n:"Recuperação assistida: o operador volante vai até a vaga e abre o carro pelo Pátio 360. O padrão é de até 15 minutos entre o problema e o carro liberado.",
 b:()=>`<div class="ttl">Um operador está indo até você</div><div class="card soft" style="text-align:center"><div class="sm">CHEGA EM</div><div style="font-size:42px;font-weight:700;color:var(--pd)">~8 min</div><div class="txt">Fique na vaga ${CARS[S.car].vaga}. Ele abre o carro pelo sistema do pátio.</div></div>`,
 f:()=>`<button class="btn" data-act="compOp" ${go("aberto")}>Simular: carro aberto</button><span class="lnk">Falar com a central</span>`},
aberto:{tag:"atual",t:"Carro e contrato abertos",n:"Final igual ao app atual. Quando há espera ou a promessa foi quebrada, o app já mostra a compensação, calculada pela hora do “Cheguei” e pela regra.",
 b:()=>`<img class="ph" src="${IMG[S.car]}" alt="" style="margin-top:6px"><div class="ttl" style="margin-top:12px">Carro e contrato abertos!</div><p class="txt">Agora é só pegar a chave e o documento no porta-luvas. Uma cópia do contrato foi enviada para o seu e-mail.</p>${compCard()}`,
 f:()=>`<button class="btn" data-restart>Finalizar</button>`},
fim:{tag:"nova",t:"Atendimento concluído",n:"Mesmo no último recurso, o cliente sai com o carro e com a compensação aplicada pela regra, sem depender da decisão do atendente.",
 b:()=>`<div class="ttl" style="margin-top:14px">Atendimento concluído no balcão</div><p class="txt">Seu contrato foi aberto. Obrigado pela paciência.</p>${compCard()}`,
 f:()=>`<button class="btn" data-restart>Finalizar</button>`}
};
function compCard(){
 const c=S.comp||(S.car=="up"?"up":null);
 const M={up:["O upgrade é a sua compensação","Você recebeu um carro de grupo superior, sem custo adicional."],
  op:["Compensação aplicada: nível 1","Sua espera ficou entre 15 e 30 minutos. Creditamos pontos de fidelidade na sua conta."],
  espera:["Compensação aplicada: nível 1","Sua espera passou do horário reservado em 15 a 30 minutos. Creditamos pontos de fidelidade."],
  balcao:["Compensação aplicada: nível 2","Você precisou ir ao balcão. Creditamos um desconto para a sua próxima locação."]};
 if(!c||!M[c]) return "";
 return `<div class="card warn" style="position:relative"><span class="tag t-nova" style="position:absolute;top:-9px;right:10px">Novo</span><div style="font-weight:700;color:var(--amt);font-size:16px">${M[c][0]}</div><div class="sm" style="color:#5a4a2a">${M[c][1]}</div></div>`;
}
const ACT={takeOnix:()=>S.car="onix",takeArgo:()=>S.car="argo",argoReady:()=>{CARS.argo.st="ok"},waitComp:()=>{CARS.argo.st="ok";S.comp="espera"},takeUp:()=>S.car="up",
 takeOnixF:()=>{S.car="onix";S.failed=true},takeUpF:()=>{S.car="up";S.failed=true},compOp:()=>S.comp="op",compBalcao:()=>S.comp="balcao"};
const TAGN={nova:["Nova","t-nova"],alt:["Alterada","t-alt"],atual:["Atual","t-atual"]};
const OBN="As três telas de apresentação já existem no app. O conteúdo muda para explicar a nova promessa antes da validação: status do carro, “Cheguei” e alternativas. Uma frase por tela, com opção de pular. Quem pula vê a mesma regra de novo na escolha, na reserva e na tela “A caminho”.";
function render(){
 clearTimeout(timer);
 const id=S.hist[S.hist.length-1], s=SCR[id], tg=TAGN[s.tag], st=STEP[id];
 const top=id=="inicio"?"":`<div class="nav">${S.hist.length>1?'<span class="bk" data-back>‹</span>':''}Retirada digital${s.ob?`<span class="sk" ${go("identidade")}>Pular</span>`:""}</div>`;
 const steps=st?`<div class="steps">${[1,2,3,4,5].map(i=>`<i class="${i<=st?"on":""}"></i>`).join("")}</div><div class="stl">Etapa ${st} de 5 · ${STN[st]}</div>`:"";
 document.getElementById("scr").innerHTML=`<div class="sb"><span>9:41</span><span>●●● ▮</span></div>${top}${steps}${s.tag!="atual"?`<span class="new">${tg[0].toUpperCase()}</span>`:""}<div class="ct">${s.b()}</div><div class="ft">${s.f()}</div>`;
 document.getElementById("note").innerHTML=`<span class="tag ${tg[1]}">${tg[0]}</span><h2>${s.t}</h2><p>${s.n||OBN}</p>`;
 document.getElementById("prog").textContent=`Cenário ${S.sc} · tela ${S.hist.length}`;
 document.querySelectorAll(".sc").forEach(b=>b.classList.toggle("on",b.dataset.sc==S.sc));
 if(s.auto&&!S.noauto) timer=setTimeout(()=>{S.hist.push("res_"+SC[S.sc].res);render()},2800);
}
function start(sc){S={sc,hist:["inicio"],car:SC[sc].pick,view:LIST.indexOf(SC[sc].pick),failed:false,comp:null};CARS.argo.st="pp";render();}
document.getElementById("scs").innerHTML=Object.entries(SC).map(([k,v])=>`<button class="sc" data-sc="${k}"><b>${k}</b>${v.n}</button>`).join("");
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-pick],[data-back],[data-restart],[data-car],.sc");if(!t)return;
 if(t.dataset.sc){start(t.dataset.sc);return}
 if(t.dataset.restart!==undefined){start(S.sc);return}
 if(t.dataset.back!==undefined){if(S.hist.length>1){S.hist.pop();render()}return}
 if(t.dataset.car){S.view=(S.view+ +t.dataset.car+LIST.length)%LIST.length;render();return}
 if(t.dataset.pick){S.car=t.dataset.pick;render();return}
 if(t.dataset.act)ACT[t.dataset.act]();
 S.hist.push(t.dataset.go);render();
 document.querySelector(".ct").scrollTop=0;
});
document.getElementById("back").onclick=()=>{if(S.hist.length>1){S.hist.pop();render()}};
document.getElementById("reset").onclick=()=>start(S.sc);
const q=new URLSearchParams(location.search);
start(q.get("c")&&SC[q.get("c")]?q.get("c"):"A");
if(q.get("s")){S.noauto=true;q.get("s").split(",").forEach(x=>{const [id,act]=x.split(":");if(act)ACT[act]();S.hist.push(id)});render();}
</script>
</body>
</html>
